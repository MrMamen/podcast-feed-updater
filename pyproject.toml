[project]
name = "podcast-feed-updater"
version = "0.1.0"
description = "Enrich podcast RSS feeds with Podcasting 2.0 tags, configured per podcast"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "lxml>=5.0.0",
    "inquirer>=3.1.0",
]

[tool.ruff]
line-length = 100

# The `dev` group is installed by a plain `uv sync` / `uv run` locally and
# skipped by CI (`uv run --no-dev`).
[dependency-groups]
dev = [
    "ruff>=0.3.0",
]
