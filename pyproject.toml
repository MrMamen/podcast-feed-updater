[project]
name = "podcast-feed-updater"
version = "0.1.0"
description = "A tool to filter and enrich podcast RSS feeds"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",
    "feedgen>=1.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "lxml>=5.0.0",
    "inquirer>=3.1.0",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

# The `dev` group is installed by a plain `uv sync` / `uv run` locally and
# skipped by CI (`uv run --no-dev`).
[dependency-groups]
dev = [
    "black>=24.0.0",
    "ruff>=0.3.0",
]
