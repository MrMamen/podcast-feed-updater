# Mal for en ny podcast. Kopier til podcasts/<id>/podcast.toml og fyll inn.
# <id> er et kort navn uten mellomrom (brukes i filnavn og --podcast <id>).
# Alle valg er beskrevet i docs/CONFIGURATION.md; podcasts/cdspill/podcast.toml
# er et fullt eksempel. Seksjoner som er kommentert ut, slås av.

[podcast]
name = "Min podcast"
source_feed = "https://example.com/feed.xml"
# podcast:guid. Lag en med uuid5 av feed-URL-en uten protokoll, se
# https://podcasting2.org/docs/podcast-namespace/tags/guid
guid = "00000000-0000-0000-0000-000000000000"
medium = "podcast"
timezone = "Europe/Oslo"
# episode_article_domain = "example.com"   # nettsted med en artikkel per episode (<link>)
# apple_podcast_id = 123456789
# apple_country = "no"
# podchaser_id = "123456"                   # for guests.py episode

[publish]
# Der output/ publiseres, f.eks. GitHub Pages
base_url = "https://<bruker>.github.io/podcast-feed-updater"
feed = "minpodcast-enriched.xml"
op3 = true

# [titles]
