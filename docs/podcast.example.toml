# Eksempel på podcast.toml. Kopier til podcasts/<id>/podcast.toml, der <id> er et
# kort navn uten mellomrom (brukes i filnavn og som --podcast <id>).
#
# Bare source_feed og base_url er påkrevd. Resten er valgfritt: fjern # for å slå på.
# Alle valg: docs/CONFIGURATION.md. Fullt eksempel: podcasts/cdspill/podcast.toml.

[podcast]
source_feed = "https://example.com/feed.xml"     # feeden som skal berikes
# name = "Min podcast"                           # visningsnavn (standard: <id>)
# guid = "..."                                   # enrich.py skriver ut riktig verdi
# timezone = "Europe/Oslo"                       # standard: UTC

[publish]
base_url = "https://<bruker>.github.io/<repo>"   # der output/ publiseres
# op3 = true                                     # nedlastingsstatistikk via op3.dev

# Episodenummer fra tittelen når itunes:episode mangler ("Episode 91: ...")
# [titles]
# episode_number_pattern = '^Episode (\d+)'
# episode_number_source = ["itunes", "title"]

# Host kapittelfilene selv; første kapittel får episodens cover
# [chapters]

# YouTube-variant med kapitlene som tidskoder: uv run enrich.py --variant youtube
# [variants.youtube]
